[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "splitin-spiderman"
version = "0.1.0a1"
description = "Personal account connector and agent bridge service client"
requires-python = ">=3.10"
license = "MIT"
[project.urls]
Repository = "https://github.com/splitintech/spiderman"
[tool.setuptools.packages.find]
where = ["src"]
