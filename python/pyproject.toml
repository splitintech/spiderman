[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "splitin-spiderman"
version = "0.1.0a2"
description = "Personal account connector and agent bridge service client"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
[project.urls]
Repository = "https://github.com/splitintech/spiderman"
[tool.setuptools.packages.find]
where = ["src"]
